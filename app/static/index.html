<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>docu-chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 16px; min-height: 280px; margin-bottom: 12px; }
  .msg { margin-bottom: 14px; white-space: pre-wrap; }
  .msg.user { font-weight: 600; }
  .sources { font-size: 0.8rem; opacity: 0.7; margin-top: 4px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
  button { padding: 10px 16px; border-radius: 6px; border: none; background: #111; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <h1>docu-chat</h1>
  <p style="opacity:.7">Ask a question about the documents in <code>docs/</code>.</p>
  <div id="log"></div>
  <form id="form">
    <input id="question" autocomplete="off" placeholder="Ask something..." />
    <button type="submit">Send</button>
  </form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("question");

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addMessage(question, "user");
  input.value = "";
  form.querySelector("button").disabled = true;

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question }),
  });
  const data = await res.json();
  const div = addMessage(data.answer, "bot");
  if (data.sources?.length) {
    const src = document.createElement("div");
    src.className = "sources";
    src.textContent = "Sources: " + data.sources.join(", ");
    div.appendChild(src);
  }
  form.querySelector("button").disabled = false;
});
</script>
</body>
</html>
